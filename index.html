
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | Welcome</title>

    <style>
        :root {
            --accent: #ff650f;
            --dark: #17191c;
            --muted: #7e838e;
            --background: #f8f9fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--background);
            font-family: Arial, sans-serif;
            color: var(--dark);

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .loading-container {
            width: min(90%, 500px);
            text-align: center;

            animation: fadeIn 0.7s ease both;
        }

        .portfolio-logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 28px;

            border-radius: 18px;
            background: var(--accent);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 32px;
            font-weight: 800;

            box-shadow:
                0 12px 30px rgba(255, 101, 15, 0.20);
        }

        .label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--muted);
        }

        h1 {
            margin: 22px 0 14px;

            font-size: clamp(28px, 5vw, 44px);
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.2;
        }

        h1 span {
            color: var(--accent);
        }

        .description {
            font-size: 14px;
            line-height: 1.8;
            color: var(--muted);
        }

        .loading-bar {
            margin: 42px auto 16px;

            width: min(100%, 300px);
            height: 4px;

            overflow: hidden;
            border-radius: 100px;
            background: #e5e7eb;
        }

        .loading-progress {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: var(--accent);

            animation: progress 1.5s ease-in-out forwards;
        }

        .loading-status {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .skip-link {
            display: inline-block;
            margin-top: 22px;
            font-size: 12px;
            color: #535862;
            text-decoration: none;
        }

        .skip-link:hover {
            color: var(--accent);
        }

        .bottom-text {
            position: fixed;
            bottom: 24px;
            left: 0;
            width: 100%;

            text-align: center;
            font-size: 11px;
            color: #a3a7b0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-container,
            .loading-progress {
                animation: none;
            }

            .loading-progress {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .portfolio-logo {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .description {
                font-size: 13px;
            }

            .loading-bar {
                margin-top: 32px;
            }
        }
    </style>

    <noscript>
        <meta http-equiv="refresh"
              content="0;url=./INDEX/Home.html">
    </noscript>
</head>

<body>

    <main class="loading-container">
        <div class="portfolio-logo">&lt;/&gt;</div>

        <div class="label">
            PERSONAL PORTFOLIO
        </div>

        <h1>
            Welcome to<br>
            My <span>Portfolio.</span>
        </h1>

        <p class="description">
            Computer Engineering · Robotics · Programming
        </p>

        <div class="loading-bar"
             role="progressbar"
             aria-label="กำลังเข้าสู่เว็บไซต์">
            <div class="loading-progress"></div>
        </div>

        <p class="loading-status">
            กำลังเข้าสู่เว็บไซต์...
        </p>

        <a href="./INDEX/Home.html" class="skip-link">
            เข้าสู่เว็บไซต์ทันที →
        </a>
    </main>

    <footer class="bottom-text">
        © 2026 Personal Engineering Portfolio
    </footer>

    <script>
        setTimeout(() => {
            window.location.replace("./INDEX/Home.html");
        }, 1500);
    </script>

</body>
</html>
